[project]
name = "trustlens"
version = "0.1.0"
description = "TrustLens threat analysis API"
readme = "README.MD"
authors = [{ email = "bbiswasrup2005@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "redis[hiredis]>=5.2",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "dnspython>=2.7",
    "tldextract>=5.1",
    "idna>=3.10",
    "selectolax>=0.3",
    "rapidfuzz>=3.11",
    "confusable-homoglyphs>=3.3",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "certifi>=2026.10.23",
    "cryptography>=50.0.2",
    "pyOpenSSL>=26.4.0",
]

[tool.uv]
package = false


[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "hypothesis>=6.120", "httpx>=0.28", "fakeredis[lua]>=2.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["scratch-*", ".tmp", "test-output-*", ".venv", ".git", ".uv-cache", ".pytest_cache", ".pytest-local-*", ".test-run-current", ".hypothesis"]

